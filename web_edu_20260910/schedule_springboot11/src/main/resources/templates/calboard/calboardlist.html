<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정목록(calboardlist.html)</title>
    <script type="text/javascript">

	function isConfirm(){
		if(confirm("정말 삭제 하시겠습니까?")){
			return true;
		}
		return false;
	}
	
	//전체선택 체크박스 기능 구현
	function allSel(bool){
		var chks=document.getElementsByName("seq");//[chk,chk,chk..]
		for (var i = 0; i < chks.length; i++) {
			chks[i].checked=bool;//true:체크, false:체크해제
		}
	}
</script>
</head>
<body>
    목록 내용: checkbox, mdate, title, regdate
    <div layout:fragment="content">
        <div id="container">
            <form>
                <table class="table">
                    <tr>
                        <th><input class="form-check-input" type="checkbox" name="all" onclick="allSel(this.checked)"/>
                        <th>일정</th>
                        <th>제목</th>
                        <th>작성일</th>
                    </tr>
                    <th:block th:if="${#lists.isEmpty(list)}">
                        <tr>
                            <td colspan="4">일정이 없습니다.</td>
                        </tr>
                    </th:block>
                    <th:block th:unless="${#lists.isEmpty(list)}">
                        <tr th:each="dto:${list}">
                            <td><input class="form-check-input" 
                                       type="checkbox"
                                       name="seq"
                                       th:value="${dto.seq}"
                                /> </td>
                            <td th:text="${@util.toDates(dto.mdate,'yyyy.MM.dd HH:mm')}"></td>
                            <td>
                                <a th:href="@{/schedule/calboarddetail(seq=${dto.seq})}" 
                                   th:text="${dto.title}"></a>
                            </td>
                            <td th:text="${#dates.format(dto.regdate,'yyyy.MM.dd') }"></td>
                        </tr>
                    </th:block>
                </table>
            </form>
        </div>
    </div>
</body>
</html>
