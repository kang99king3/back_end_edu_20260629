<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정추가하기</title>
</head>
<body>
    <div layout:fragment="content">
        <div id="container">
            <h1>일정 추가하기</h1>
            <form th:action="@{/schedule/addcalboard}" method="post"
                  th:object="${insertCalCommand}">
                <table class="table">
                    <tr>
                        <th>아이디</th>
                        <td>
                            <input th:field="*{id}" 
                                   type="text"
                                   name="id"
                                   class="form-control"/>
                            <span th:if="${#field.hasErrors('id')}" 
                                  th:errors="*{id}"
                                  class="errorField"
                            ></span>
                        </td>
                    </tr>
                    <tr>
                        <th>일정</th>
                        <td></td>
                    </tr>
                    <tr>
                        <th>제목</th>
                        <td>
                            <input th:field="*{title}" 
                                   type="text"
                                   name="title"
                                   class="form-control"/>
                            <span th:if="${#field.hasErrors('title')}" 
                                  th:errors="*{title}"
                                  class="errorField"
                            ></span>
                        </td>
                    </tr>
                    <tr>
                        <th>내용</th>
                        <td>
                            <textarea rows="10" cols="60" 
                                   th:field="*{content}" 
                                   type="text"
                                   name="content"
                                   class="form-control"></textarea>
                            <span th:if="${#field.hasErrors('content')}" 
                                  th:errors="*{content}"
                                  class="errorField"
                            ></span>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <input type="submit" value="일정추가" class="btn btn-primary"/>
                            <input type="button" value="달력" class="btn btn-primary"
                                   th:onclick="|location.href='@{/schedule/calendar(year=${insertCalCommand.year},month=${insertCalCommand.month})}'|"
                            />
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>
</html>
